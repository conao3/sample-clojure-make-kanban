type Task {
  id: ID!
  taskId: String!
  title: String!
  status: String!
  createdAt: String
  updatedAt: String
}

type Query {
  tasks: [Task]
}

type Mutation {
  createTask(title: String!, status: String!): Task
  updateTask(taskId: String!, title: String, status: String): Task
  deleteTask(taskId: String!): Task
}

schema {
  query: Query
  mutation: Mutation
}
